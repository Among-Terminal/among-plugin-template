name: Release

# A version tag builds both architectures and publishes an immutable release
# that Among can install. Only the publish job of the called workflow receives
# this job's write token, and it runs none of this repository's code. Runs for
# the same tag wait for each other instead of publishing twice.
#
# Candidate tags such as v1.0.0-rc.1 contain a hyphen and are excluded: this
# workflow publishes stable releases only, and a candidate published through it
# would become the repository's latest release.

on:
  push:
    tags: ['v*', '!v*-*']

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: Among-Terminal/among-plugins/.github/workflows/plugin-release.yml@783c9b07d3a307e89260ae875987945d0885070a
